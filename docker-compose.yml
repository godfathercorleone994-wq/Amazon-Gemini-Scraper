version: '3.8'

services:
  app:
    build: .
    container_name: amazon-scraper-app
    ports:
      - "8000:8000"
    environment:
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis
      - mongodb
    volumes:
      - ./:/app
      - ./logs:/app/logs
    networks:
      - scraper-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: amazon-scraper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scraper-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: amazon-scraper-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=amazon_scraper
    volumes:
      - mongo_data:/data/db
    networks:
      - scraper-network
    restart: unless-stopped

  celery:
    build: .
    container_name: amazon-scraper-celery
    command: celery -A workers.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - app
    volumes:
      - ./:/app
    networks:
      - scraper-network
    restart: unless-stopped

  flower:
    build: .
    container_name: amazon-scraper-flower
    command: celery -A workers.celery_app flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - celery
    networks:
      - scraper-network
    restart: unless-stopped

  streamlit:
    build: .
    container_name: amazon-scraper-dashboard
    command: streamlit run features/dashboard/streamlit_app.py
    ports:
      - "8501:8501"
    depends_on:
      - app
    volumes:
      - ./:/app
    networks:
      - scraper-network
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:

networks:
  scraper-network:
    driver: bridge
