name: Railway Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  preview-info:
    name: Preview Deployment Info
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Preview deployment information
        run: |
          echo "==================================="
          echo "Railway Preview Deployment"
          echo "==================================="
          echo ""
          echo "This workflow provides information for Railway preview deployments."
          echo ""
          echo "To enable automatic Railway preview deployments:"
          echo ""
          echo "1. Install Railway GitHub App:"
          echo "   - Go to https://railway.app"
          echo "   - Navigate to your project settings"
          echo "   - Connect to GitHub repository"
          echo ""
          echo "2. Configure Railway triggers:"
          echo "   - Enable 'Deploy on PR' in Railway settings"
          echo "   - Railway will automatically create preview environments"
          echo ""
          echo "3. Environment variables:"
          echo "   - Preview deployments inherit production variables"
          echo "   - Override as needed in Railway dashboard"
          echo ""
          echo "For manual deployment, use Railway CLI:"
          echo "   railway up --detach"
          echo ""
      
      - name: Check deployment requirements
        run: |
          echo "Checking deployment files..."
          
          required_files=(
            "Dockerfile"
            "requirements.txt"
            "railway.json"
            ".env.example"
            "api/main.py"
          )
          
          all_present=true
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ $file missing"
              all_present=false
            fi
          done
          
          if [ "$all_present" = true ]; then
            echo ""
            echo "✅ All required files present for Railway deployment"
          else
            echo ""
            echo "⚠️  Some required files are missing"
            exit 1
          fi
      
      - name: Estimate deployment resources
        run: |
          echo ""
          echo "==================================="
          echo "Estimated Railway Resources"
          echo "==================================="
          echo ""
          echo "Docker Image Size: ~1.5-2GB (includes Playwright browsers)"
          echo "Memory Required: 1-2GB minimum"
          echo "CPU: 1 vCPU minimum"
          echo "Build Time: 3-5 minutes"
          echo ""
          echo "Recommended Railway Plan:"
          echo "- Hobby Plan ($5/month) for testing"
          echo "- Pro Plan for production workloads"
          echo ""
      
      - name: Security checklist
        run: |
          echo "==================================="
          echo "Security Deployment Checklist"
          echo "==================================="
          echo ""
          
          if [ -f .env.example ]; then
            echo "✓ Environment template exists"
          else
            echo "✗ .env.example missing"
          fi
          
          if grep -q "SECRET_KEY=change-me" .env.example; then
            echo "✓ SECRET_KEY placeholder present"
          fi
          
          if [ -f .gitignore ]; then
            if grep -q ".env" .gitignore; then
              echo "✓ .env file is gitignored"
            else
              echo "⚠️  .env should be in .gitignore"
            fi
          fi
          
          echo ""
          echo "Security reminders:"
          echo "- Use strong SECRET_KEY in production"
          echo "- Never commit API keys or secrets"
          echo "- Enable DEBUG=False in production"
          echo "- Use Railway's secret management"
          echo "- Regularly update dependencies"
